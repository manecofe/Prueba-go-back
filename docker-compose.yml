version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: task_manager_db
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: task_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d task_manager"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - task_manager_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_manager_backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://taskuser:taskpass@postgres:5432/task_manager
      PORT: 4000
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - task_manager_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  task_manager_network:
    driver: bridge
